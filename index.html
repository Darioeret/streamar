<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StreamAR - TV Argentina en Vivo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0a0e27;
            --secondary: #1a1f4e;
            --accent: #e91e63;
            --accent2: #ff6b35;
            --text: #ffffff;
            --text-dim: #8892b0;
            --glass: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* SPLASH */
        .splash-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0d1137 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s, transform 0.8s;
        }
        .splash-screen.hidden { opacity: 0; transform: scale(1.1); pointer-events: none; }

        .splash-logo {
            font-size: 4rem; font-weight: 900;
            color: #75b9ff;
            background: linear-gradient(135deg, #75b9ff, #e91e63, #ff6b35);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s ease-in-out infinite;
            margin-bottom: 10px;
        }
        .splash-sub { color: var(--text-dim); font-size: 1.1rem; letter-spacing: 3px; text-transform: uppercase; }
        .splash-flag { font-size: 3rem; margin-top: 20px; animation: bounce 1s ease-in-out infinite; }
        .splash-loader { margin-top: 40px; width: 200px; height: 3px; background: var(--glass); border-radius: 3px; overflow: hidden; }
        .splash-loader-bar { height: 100%; background: linear-gradient(90deg, #75b9ff, #e91e63); border-radius: 3px; animation: load 2s ease-in-out forwards; }

        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* APP */
        .app-container { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; }

        /* HEADER */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 20px;
            background: linear-gradient(180deg, rgba(10,14,39,0.95), rgba(10,14,39,0.7));
            backdrop-filter: blur(20px);
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
        }
        .header-logo { display: flex; align-items: center; gap: 10px; }
        .header-logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #75b9ff, #e91e63);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 900;
        }
        .header-logo-text {
            font-size: 1.3rem; font-weight: 800;
            color: #75b9ff;
            background: linear-gradient(135deg, #75b9ff, #e91e63);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .header-btn {
            background: var(--glass); border: 1px solid var(--glass-border);
            color: var(--text); padding: 8px 14px; border-radius: 10px;
            font-size: 0.85rem; cursor: pointer; transition: all 0.3s;
            font-family: 'Inter', sans-serif; font-weight: 500;
        }
        .header-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
        .header-btn.live { background: rgba(233,30,99,0.2); border-color: rgba(233,30,99,0.4); color: #e91e63; }
        .live-dot { display: inline-block; width: 8px; height: 8px; background: #e91e63; border-radius: 50%; margin-right: 6px; animation: livePulse 1.5s ease-in-out infinite; }
        @keyframes livePulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }

        /* PLAYER */
        .player-section {
            flex: 1; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .player-wrapper { width: 100%; height: 100%; position: relative; }
        .player-wrapper iframe { width: 100%; height: 100%; border: none; }

        .player-placeholder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0a0e27, #1a1f4e); z-index: 5;
        }
        .player-placeholder.hidden { display: none; }
        .placeholder-icon { font-size: 5rem; margin-bottom: 20px; opacity: 0.5; }
        .placeholder-text { color: var(--text-dim); font-size: 1.2rem; }

        .channel-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            display: flex; align-items: center; gap: 12px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            padding: 10px 18px; border-radius: 14px;
            border: 1px solid var(--glass-border);
            transition: opacity 0.5s;
        }
        .channel-overlay.fade { opacity: 0; }
        .channel-number-badge {
            background: linear-gradient(135deg, #e91e63, #ff6b35);
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1rem;
        }
        .channel-overlay-info h3 { font-size: 1rem; font-weight: 700; }
        .channel-overlay-info span { font-size: 0.75rem; color: var(--text-dim); }

        .zapping-indicator {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 20; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
            border-radius: 20px; padding: 30px 40px; text-align: center;
            border: 1px solid var(--glass-border);
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .zapping-indicator.show { opacity: 1; }
        .zapping-number {
            font-size: 4rem; font-weight: 900; line-height: 1;
            color: #75b9ff;
            background: linear-gradient(135deg, #75b9ff, #e91e63);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .zapping-name { font-size: 1.2rem; font-weight: 600; margin-top: 8px; }
        .zapping-status { font-size: 0.8rem; color: #e91e63; margin-top: 4px; }

        /* CONTROLS */
        .controls-bar {
            display: flex; align-items: center; justify-content: center; gap: 16px;
            padding: 14px 20px;
            background: linear-gradient(0deg, rgba(10,14,39,0.95), rgba(10,14,39,0.7));
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            z-index: 100;
        }
        .ctrl-btn {
            background: var(--glass); border: 1px solid var(--glass-border);
            color: var(--text); width: 50px; height: 50px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; cursor: pointer; transition: all 0.3s;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn.ch-up { background: linear-gradient(135deg, rgba(117,185,255,0.2), rgba(117,185,255,0.05)); border-color: rgba(117,185,255,0.3); }
        .ctrl-btn.ch-down { background: linear-gradient(135deg, rgba(233,30,99,0.2), rgba(233,30,99,0.05)); border-color: rgba(233,30,99,0.3); }
        .ctrl-btn.fav { background: linear-gradient(135deg, rgba(255,193,7,0.2), rgba(255,193,7,0.05)); border-color: rgba(255,193,7,0.3); }
        .ctrl-btn.fav.active { background: rgba(255,193,7,0.3); border-color: rgba(255,193,7,0.6); }
        .ctrl-btn.fullscreen-btn { background: linear-gradient(135deg, rgba(76,175,80,0.2), rgba(76,175,80,0.05)); border-color: rgba(76,175,80,0.3); }

        .channel-display {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 8px 20px; text-align: center; min-width: 120px;
        }
        .channel-display-num {
            font-size: 1.5rem; font-weight: 800;
            color: #75b9ff;
            background: linear-gradient(135deg, #75b9ff, #e91e63);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .channel-display-name { font-size: 0.7rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }

        /* GUIDE */
        .guide-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 200;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .guide-overlay.show { opacity: 1; pointer-events: all; }
        .guide-sheet {
            position: fixed; bottom: 0; left: 0; width: 100%; max-height: 70vh;
            background: linear-gradient(180deg, #12163a, #0a0e27);
            border-radius: 24px 24px 0 0; border-top: 1px solid var(--glass-border);
            z-index: 201; transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column;
        }
        .guide-sheet.show { transform: translateY(0); }
        .guide-handle { width: 40px; height: 4px; background: var(--glass-border); border-radius: 4px; margin: 12px auto 0; }
        .guide-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; }
        .guide-header h2 { font-size: 1.3rem; font-weight: 700; }
        .guide-header span { color: var(--text-dim); font-size: 0.85rem; }
        .guide-search { margin: 0 24px 16px; position: relative; }
        .guide-search input {
            width: 100%; background: var(--glass); border: 1px solid var(--glass-border);
            color: var(--text); padding: 12px 16px 12px 42px; border-radius: 12px;
            font-size: 0.95rem; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.3s;
        }
        .guide-search input:focus { border-color: rgba(117,185,255,0.4); }
        .guide-search .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
        .guide-list { flex: 1; overflow-y: auto; padding: 0 16px 24px; }
        .guide-list::-webkit-scrollbar { width: 4px; }
        .guide-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
        .guide-channel {
            display: flex; align-items: center; gap: 14px; padding: 14px 16px;
            border-radius: 14px; cursor: pointer; transition: all 0.3s; margin-bottom: 4px;
        }
        .guide-channel:hover { background: var(--glass); }
        .guide-channel.active { background: rgba(117,185,255,0.1); border: 1px solid rgba(117,185,255,0.2); }
        .guide-ch-num {
            width: 36px; height: 36px; background: var(--glass);
            border: 1px solid var(--glass-border); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.9rem; flex-shrink: 0;
        }
        .guide-channel.active .guide-ch-num { background: linear-gradient(135deg, #75b9ff, #e91e63); border: none; }
        .guide-ch-logo {
            width: 44px; height: 44px; border-radius: 12px;
            background: var(--glass); display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; flex-shrink: 0;
        }
        .guide-ch-info { flex: 1; min-width: 0; }
        .guide-ch-info h4 { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .guide-ch-info span { font-size: 0.75rem; color: var(--text-dim); }
        .guide-ch-views { font-size: 0.75rem; color: var(--text-dim); text-align: right; flex-shrink: 0; }
        .guide-ch-views strong { display: block; color: var(--text); font-size: 0.85rem; }
        .guide-ch-live { width: 10px; height: 10px; background: #e91e63; border-radius: 50%; flex-shrink: 0; animation: livePulse 1.5s ease-in-out infinite; }

        .fav-filter { display: flex; gap: 8px; padding: 0 24px 12px; overflow-x: auto; }
        .fav-filter-btn {
            background: var(--glass); border: 1px solid var(--glass-border);
            color: var(--text-dim); padding: 6px 16px; border-radius: 20px;
            font-size: 0.8rem; cursor: pointer; white-space: nowrap;
            font-family: 'Inter', sans-serif; transition: all 0.3s;
        }
        .fav-filter-btn.active { background: linear-gradient(135deg, rgba(117,185,255,0.2), rgba(233,30,99,0.2)); border-color: rgba(117,185,255,0.3); color: var(--text); }

        /* LOGIN */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 300;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .login-overlay.show { opacity: 1; pointer-events: all; }
        .login-modal {
            background: linear-gradient(180deg, #1a1f4e, #0a0e27);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 36px; width: 90%; max-width: 400px;
            transform: scale(0.9); transition: transform 0.3s; position: relative;
        }
        .login-overlay.show .login-modal { transform: scale(1); }
        .login-modal h2 { font-size: 1.5rem; margin-bottom: 8px; text-align: center; }
        .login-modal p { color: var(--text-dim); text-align: center; margin-bottom: 24px; font-size: 0.9rem; }
        .login-input {
            width: 100%; background: var(--glass); border: 1px solid var(--glass-border);
            color: var(--text); padding: 14px 16px; border-radius: 12px;
            font-size: 1rem; font-family: 'Inter', sans-serif; outline: none;
            margin-bottom: 12px; transition: border-color 0.3s;
        }
        .login-input:focus { border-color: rgba(117,185,255,0.4); }
        .login-btn {
            width: 100%; background: linear-gradient(135deg, #75b9ff, #e91e63);
            border: none; color: white; padding: 14px; border-radius: 12px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            font-family: 'Inter', sans-serif; margin-top: 8px;
            transition: transform 0.3s, opacity 0.3s;
        }
        .login-btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .login-close {
            position: absolute; top: 16px; right: 20px;
            background: none; border: none; color: var(--text-dim);
            font-size: 1.5rem; cursor: pointer;
        }
        .login-divider { text-align: center; color: var(--text-dim); margin: 16px 0; font-size: 0.85rem; position: relative; }
        .login-divider::before, .login-divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--glass-border); }
        .login-divider::before { left: 0; } .login-divider::after { right: 0; }

        /* TOAST */
        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); padding: 12px 24px;
            border-radius: 12px; font-size: 0.9rem; z-index: 500;
            opacity: 0; transition: all 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* SWIPE HINT */
        .swipe-hint {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            color: var(--text-dim); font-size: 0.75rem; z-index: 10;
            animation: fadeInOut 3s ease-in-out; pointer-events: none;
        }
        @keyframes fadeInOut { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

        /* VOLUME */
        .volume-control {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 8px;
            opacity: 0; transition: opacity 0.3s;
        }
        .volume-control.show { opacity: 1; }
        .volume-bar { width: 6px; height: 120px; background: var(--glass); border-radius: 3px; position: relative; overflow: hidden; }
        .volume-fill { position: absolute; bottom: 0; width: 100%; background: linear-gradient(0deg, #75b9ff, #e91e63); border-radius: 3px; transition: height 0.2s; }
        .volume-icon { font-size: 1.2rem; }

        @media (min-width: 768px) {
            .app-container { max-width: 500px; margin: 0 auto; border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border); }
            .guide-sheet { max-width: 500px; left: 50%; transform: translateX(-50%) translateY(100%); }
            .guide-sheet.show { transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>

    <!-- SPLASH -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-logo">StreamAR</div>
        <div class="splash-sub">TV Argentina en Vivo</div>
        <div class="splash-flag">🇦🇷</div>
        <div class="splash-loader"><div class="splash-loader-bar"></div></div>
    </div>

    <!-- APP -->
    <div class="app-container" id="appContainer">
        <div class="header">
            <div class="header-logo">
                <div class="header-logo-icon">▶</div>
                <div class="header-logo-text">StreamAR</div>
            </div>
            <div class="header-actions">
                <button class="header-btn live" onclick="showToast('🔴 En vivo ahora')"><span class="live-dot"></span>VIVO</button>
                <button class="header-btn" id="userBtn" onclick="openLogin()">👤 Ingresar</button>
            </div>
        </div>

        <div class="player-section" id="playerSection">
            <div class="player-wrapper" id="playerWrapper">
                <div class="player-placeholder" id="playerPlaceholder">
                    <div class="placeholder-icon">📺</div>
                    <div class="placeholder-text">Seleccioná un canal para empezar</div>
                </div>
            </div>

            <div class="channel-overlay fade" id="channelOverlay">
                <div class="channel-number-badge" id="overlayNum">1</div>
                <div class="channel-overlay-info">
                    <h3 id="overlayName">Luzu</h3>
                    <span id="overlayCategory">Entretenimiento</span>
                </div>
            </div>

            <div class="zapping-indicator" id="zappingIndicator">
                <div class="zapping-number" id="zapNum">01</div>
                <div class="zapping-name" id="zapName">Luzu</div>
                <div class="zapping-status">● EN VIVO</div>
            </div>

            <div class="volume-control" id="volumeControl">
                <div class="volume-icon">🔊</div>
                <div class="volume-bar"><div class="volume-fill" id="volumeFill" style="height: 70%"></div></div>
            </div>

            <div class="swipe-hint" id="swipeHint">↑↓ Deslizá para cambiar canal · Guía</div>
        </div>

        <div class="controls-bar">
            <button class="ctrl-btn ch-up" onclick="changeChannel(-1)" title="Canal anterior">⬆</button>
            <button class="ctrl-btn" onclick="openGuide()" title="Guía de canales">☰</button>
            <div class="channel-display">
                <div class="channel-display-num" id="ctrlChNum">--</div>
                <div class="channel-display-name" id="ctrlChName">Sin canal</div>
            </div>
            <button class="ctrl-btn fav" id="favBtn" onclick="toggleFav()" title="Favorito">⭐</button>
            <button class="ctrl-btn ch-down" onclick="changeChannel(1)" title="Canal siguiente"></button>
            <button class="ctrl-btn fullscreen-btn" onclick="toggleFullscreen()" title="Pantalla completa">⛶</button>
        </div>
    </div>

    <!-- GUIDE -->
    <div class="guide-overlay" id="guideOverlay" onclick="closeGuide()"></div>
    <div class="guide-sheet" id="guideSheet">
        <div class="guide-handle"></div>
        <div class="guide-header">
            <h2>📺 Guía de Canales</h2>
            <span id="guideCount">15 canales</span>
        </div>
        <div class="guide-search">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Buscar canal..." id="searchInput" oninput="filterChannels()">
        </div>
        <div class="fav-filter">
            <button class="fav-filter-btn active" onclick="setFilter('all', this)">Todos</button>
            <button class="fav-filter-btn" onclick="setFilter('fav', this)">⭐ Favoritos</button>
            <button class="fav-filter-btn" onclick="setFilter('entretenimiento', this)">Entretenimiento</button>
            <button class="fav-filter-btn" onclick="setFilter('noticias', this)">Noticias</button>
            <button class="fav-filter-btn" onclick="setFilter('musica', this)">Música</button>
        </div>
        <div class="guide-list" id="guideList"></div>
    </div>

    <!-- LOGIN -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-modal">
            <button class="login-close" onclick="closeLogin()">✕</button>
            <h2>Bienvenido a StreamAR</h2>
            <p>Registrate para guardar tus favoritos y preferencias</p>
            <input class="login-input" type="text" placeholder="Nombre de usuario" id="loginUser">
            <input class="login-input" type="email" placeholder="Email" id="loginEmail">
            <input class="login-input" type="password" placeholder="Contraseña" id="loginPass">
            <button class="login-btn" onclick="doLogin()">Crear cuenta gratis</button>
            <div class="login-divider">o</div>
            <button class="login-btn" style="background: var(--glass); border: 1px solid var(--glass-border);" onclick="doLoginGuest()">Entrar como invitado</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== CANALES =====
              const channels = [
            // 📺 Canales 24/7 (SIEMPRE funcionan)
            { id: 1, name: "Infobae", category: "noticias", views: "4.164.566", emoji: "📡", platform: "youtube", youtubeSearch: "Infobae", description: "Noticias 24/7" },
            { id: 2, name: "TN Todo Noticias", category: "noticias", views: "10.000.000", emoji: "📰", platform: "youtube", youtubeSearch: "Todo Noticias TN en vivo", description: "Noticias 24 horas" },
            { id: 3, name: "C5N", category: "noticias", views: "8.500.000", emoji: "📺", platform: "youtube", youtubeSearch: "C5N en vivo", description: "Canal de noticias 24/7" },
            { id: 4, name: "Crónica TV", category: "noticias", views: "9.800.000", emoji: "📹", platform: "youtube", youtubeSearch: "Crónica TV en vivo", description: "Noticias 24 horas" },
            { id: 5, name: "TV Pública", category: "entretenimiento", views: "5.000.000", emoji: "🇦🇷", platform: "youtube", youtubeSearch: "TV Pública Argentina en vivo", description: "Canal público 24/7" },
            { id: 6, name: "DeporTV", category: "entretenimiento", views: "4.200.000", emoji: "⚽", platform: "youtube", youtubeSearch: "DeporTV en vivo", description: "Deportes 24/7" },
            { id: 7, name: "Encuentro", category: "entretenimiento", views: "4.500.000", emoji: "📚", platform: "youtube", youtubeSearch: "Encuentro en vivo", description: "Cultura y educación" },
            { id: 8, name: "Canal 26", category: "noticias", views: "5.500.000", emoji: "📺", platform: "youtube", youtubeSearch: "Canal 26 en vivo", description: "Noticias 24 horas" },
            { id: 9, name: "A24", category: "noticias", views: "7.200.000", emoji: "🗞️", platform: "youtube", youtubeSearch: "A24 en vivo", description: "Noticias en vivo" },
            { id: 10, name: "LN+", category: "noticias", views: "6.500.000", emoji: "📡", platform: "youtube", youtubeSearch: "LN+ La Nación en vivo", description: "Noticias 24/7" },
            
            // 🎮 Canales de Streaming / Twitch (funcionan cuando transmiten)
            { id: 11, name: "Luzu", category: "entretenimiento", views: "92.145.765", emoji: "🎮", platform: "twitch", twitchUser: "luzu", description: "Gaming y entretenimiento" },
            { id: 12, name: "Olga", category: "entretenimiento", views: "45.147.073", emoji: "🎭", platform: "twitch", twitchUser: "olgavillafane", description: "Humor y variedades" },
            { id: 13, name: "Azz Stream", category: "entretenimiento", views: "19.998.980", emoji: "🎬", platform: "twitch", twitchUser: "azzstream", description: "Streams y contenido" },
            { id: 14, name: "Blender", category: "entretenimiento", views: "14.187.432", emoji: "🎨", platform: "twitch", twitchUser: "blenderar", description: "Creatividad y diseño" },
            { id: 15, name: "La Casa Stream", category: "entretenimiento", views: "13.247.086", emoji: "🏠", platform: "twitch", twitchUser: "lacasastream", description: "Reality y streams" },
            { id: 16, name: "Bondi", category: "entretenimiento", views: "11.887.764", emoji: "🚌", platform: "twitch", twitchUser: "bondiar", description: "Cultura urbana" },
            { id: 17, name: "Resumido Info", category: "noticias", views: "5.561.484", emoji: "📰", platform: "youtube", youtubeSearch: "Resumido Info en vivo", description: "Noticias resumidas" },
            { id: 18, name: "Picado TV", category: "entretenimiento", views: "5.017.700", emoji: "⚽", platform: "twitch", twitchUser: "picadotv", description: "Deportes y más" },
            { id: 19, name: "Carnaval", category: "entretenimiento", views: "4.595.073", emoji: "🎉", platform: "twitch", twitchUser: "carnavalar", description: "Fiesta y música" },
            { id: 20, name: "Vorterix", category: "musica", views: "4.994.387", emoji: "🎵", platform: "youtube", youtubeSearch: "Vorterix en vivo", description: "Radio y música en vivo" },
            { id: 21, name: "Gelatina", category: "entretenimiento", views: "2.809.375", emoji: "🍮", platform: "twitch", twitchUser: "gelatinaar", description: "Contenido juvenil" },
            { id: 22, name: "Futurock", category: "musica", views: "2.244.463", emoji: "🎸", platform: "youtube", youtubeSearch: "Futurock en vivo", description: "Rock y música alternativa" },
            { id: 23, name: "DGO", category: "entretenimiento", views: "2.436.757", emoji: "🎯", platform: "twitch", twitchUser: "dgo", description: "Gaming y streams" },
            { id: 24, name: "Carajo", category: "musica", views: "1.974.647", emoji: "🤘", platform: "youtube", youtubeSearch: "Carajo banda en vivo", description: "Rock en vivo" }
        ];
        // ===== ESTADO =====
        let currentChannel = -1;
        let favorites = JSON.parse(localStorage.getItem('streamar_favs') || '[]');
        let currentFilter = 'all';
        let zappingTimeout = null;
        let overlayTimeout = null;
        let volume = 70;
        let isLoggedIn = false;
        let userName = '';

        // ===== SPLASH =====
        setTimeout(() => {
            document.getElementById('splashScreen').classList.add('hidden');
            setTimeout(() => { document.getElementById('swipeHint').style.display = 'none'; }, 4000);
        }, 2500);

        // ===== CANALES =====
        function changeChannel(direction) {
            if (channels.length === 0) return;
            let newIndex;
            if (currentChannel === -1) {
                newIndex = direction > 0 ? 0 : channels.length - 1;
            } else {
                newIndex = currentChannel + direction;
                if (newIndex >= channels.length) newIndex = 0;
                if (newIndex < 0) newIndex = channels.length - 1;
            }
            selectChannel(newIndex);
        }

        function selectChannel(index) {
            currentChannel = index;
            const ch = channels[index];
            const wrapper = document.getElementById('playerWrapper');
            const placeholder = document.getElementById('playerPlaceholder');
            placeholder.classList.add('hidden');

            const existingIframe = wrapper.querySelector('iframe');
            if (existingIframe) existingIframe.remove();

            const iframe = document.createElement('iframe');
            iframe.allowFullscreen = true;

            if (ch.platform === 'twitch') {
                // Twitch embed
                iframe.src = `https://player.twitch.tv/?channel=${ch.twitchUser}&parent=${window.location.hostname}&autoplay=true&muted=false`;
                iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            } else {
                // YouTube búsqueda por nombre (sin necesidad de Channel ID)
                iframe.src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(ch.youtubeSearch)}&autoplay=1`;
                iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
            }

            wrapper.appendChild(iframe);

            document.getElementById('ctrlChNum').textContent = String(ch.id).padStart(2, '0');
            document.getElementById('ctrlChName').textContent = ch.name;
            document.getElementById('overlayNum').textContent = ch.id;
            document.getElementById('overlayName').textContent = ch.name;
            document.getElementById('overlayCategory').textContent = ch.description;

            const overlay = document.getElementById('channelOverlay');
            overlay.classList.remove('fade');
            clearTimeout(overlayTimeout);
            overlayTimeout = setTimeout(() => overlay.classList.add('fade'), 3000);

            showZapping(ch);
            updateFavBtn();
        }

        function showZapping(ch) {
            const zap = document.getElementById('zappingIndicator');
            document.getElementById('zapNum').textContent = String(ch.id).padStart(2, '0');
            document.getElementById('zapName').textContent = ch.name;
            zap.classList.add('show');
            clearTimeout(zappingTimeout);
            zappingTimeout = setTimeout(() => zap.classList.remove('show'), 1500);
        }

        // ===== GUÍA =====
        function openGuide() {
            document.getElementById('guideOverlay').classList.add('show');
            document.getElementById('guideSheet').classList.add('show');
            renderGuideList();
        }
        function closeGuide() {
            document.getElementById('guideOverlay').classList.remove('show');
            document.getElementById('guideSheet').classList.remove('show');
        }

        function renderGuideList() {
            const list = document.getElementById('guideList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = channels.filter(ch => {
                const matchSearch = ch.name.toLowerCase().includes(search) || ch.description.toLowerCase().includes(search);
                const matchFilter = currentFilter === 'all' ||
                    (currentFilter === 'fav' && favorites.includes(ch.id)) ||
                    ch.category === currentFilter;
                return matchSearch && matchFilter;
            });

            document.getElementById('guideCount').textContent = `${filtered.length} canal${filtered.length !== 1 ? 'es' : ''}`;

            list.innerHTML = filtered.map(ch => `
                <div class="guide-channel ${currentChannel === channels.indexOf(ch) ? 'active' : ''}" onclick="selectChannelFromGuide(${channels.indexOf(ch)})">
                    <div class="guide-ch-num">${String(ch.id).padStart(2, '0')}</div>
                    <div class="guide-ch-logo">${ch.emoji}</div>
                    <div class="guide-ch-info">
                        <h4>${ch.name}</h4>
                        <span>${ch.description} · ${ch.platform === 'twitch' ? ' Twitch' : '🔴 YouTube'}</span>
                    </div>
                    <div class="guide-ch-views"><strong>${ch.views}</strong>vistas</div>
                    <div class="guide-ch-live"></div>
                </div>
            `).join('');
        }

        function selectChannelFromGuide(index) {
            selectChannel(index);
            setTimeout(() => closeGuide(), 500);
        }

        function filterChannels() { renderGuideList(); }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.fav-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGuideList();
        }

        // ===== FAVORITOS =====
        function toggleFav() {
            if (currentChannel === -1) return;
            const chId = channels[currentChannel].id;
            const idx = favorites.indexOf(chId);
            if (idx > -1) {
                favorites.splice(idx, 1);
                showToast(`⭐ ${channels[currentChannel].name} removido de favoritos`);
            } else {
                favorites.push(chId);
                showToast(`⭐ ${channels[currentChannel].name} agregado a favoritos`);
            }
            localStorage.setItem('streamar_favs', JSON.stringify(favorites));
            updateFavBtn();
        }

        function updateFavBtn() {
            const btn = document.getElementById('favBtn');
            if (currentChannel === -1) { btn.classList.remove('active'); return; }
            btn.classList.toggle('active', favorites.includes(channels[currentChannel].id));
        }

        // ===== FULLSCREEN =====
        function toggleFullscreen() {
            const player = document.getElementById('playerSection');
            if (!document.fullscreenElement) {
                player.requestFullscreen?.() || player.webkitRequestFullscreen?.();
            } else {
                document.exitFullscreen?.() || document.webkitExitFullscreen?.();
            }
        }

        // ===== LOGIN =====
        function openLogin() {
            if (isLoggedIn) { showToast(`👋 Hola ${userName}!`); return; }
            document.getElementById('loginOverlay').classList.add('show');
        }
        function closeLogin() { document.getElementById('loginOverlay').classList.remove('show'); }

        function doLogin() {
            const user = document.getElementById('loginUser').value;
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            if (!user || !email || !pass) { showToast('⚠️ Completá todos los campos'); return; }
            isLoggedIn = true; userName = user;
            localStorage.setItem('streamar_user', JSON.stringify({ user, email }));
            closeLogin();
            showToast(`¡Bienvenido ${user}!`);
            updateHeaderUser();
        }

        function doLoginGuest() {
            isLoggedIn = true; userName = 'Invitado';
            closeLogin();
            showToast('👋 Entraste como invitado');
            updateHeaderUser();
        }

        function updateHeaderUser() {
            document.getElementById('userBtn').textContent = `👤 ${userName}`;
        }

        const savedUser = JSON.parse(localStorage.getItem('streamar_user') || 'null');
        if (savedUser) { isLoggedIn = true; userName = savedUser.user; updateHeaderUser(); }

        // ===== TOAST =====
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ===== TECLADO =====
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': e.preventDefault(); changeChannel(-1); break;
                case 'ArrowDown': e.preventDefault(); changeChannel(1); break;
                case 'ArrowRight': e.preventDefault(); changeChannel(1); break;
                case 'ArrowLeft': e.preventDefault(); changeChannel(-1); break;
                case 'g': case 'G': openGuide(); break;
                case 'Escape': closeGuide(); closeLogin(); break;
                case 'f': case 'F': toggleFullscreen(); break;
                case 'm': case 'M': toggleFav(); break;
                default:
                    const num = parseInt(e.key);
                    if (num >= 1 && num <= 9) {
                        const idx = channels.findIndex(ch => ch.id === num);
                        if (idx > -1) selectChannel(idx);
                    }
                    break;
            }
        });

        // ===== TOUCH =====
        let touchStartY = 0;
        const playerSection = document.getElementById('playerSection');
        playerSection.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
        playerSection.addEventListener('touchend', (e) => {
            const deltaY = touchStartY - e.changedTouches[0].clientY;
            if (Math.abs(deltaY) > 50) {
                if (deltaY > 0) changeChannel(1); else changeChannel(-1);
            }
        }, { passive: true });

        // ===== VOLUMEN =====
        playerSection.addEventListener('wheel', (e) => {
            e.preventDefault();
            const volControl = document.getElementById('volumeControl');
            volControl.classList.add('show');
            if (e.deltaY < 0) volume = Math.min(100, volume + 5);
            else volume = Math.max(0, volume - 5);
            document.getElementById('volumeFill').style.height = volume + '%';
            clearTimeout(window.volTimeout);
            window.volTimeout = setTimeout(() => volControl.classList.remove('show'), 1500);
        }, { passive: false });

        // ===== AUTO INICIO =====
        setTimeout(() => selectChannel(0), 3000);
        renderGuideList();
    </script>
</body>
</html>
